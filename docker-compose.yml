services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: workflowops
      POSTGRES_USER: workflowops
      POSTGRES_PASSWORD: workflowops
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflowops -d workflowops"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: { context: ./backend }
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://workflowops:workflowops@postgres:5432/workflowops
      REDIS_URL: redis://redis:6379/0
      AUTO_CREATE_TABLES: "false"
      LOCAL_SYNC_WORKER: "false"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - ./demo_data:/app/demo_data:ro
      - ./sample_outputs:/app/sample_outputs

  worker:
    build: { context: ./backend }
    env_file: .env.example
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+psycopg://workflowops:workflowops@postgres:5432/workflowops
      REDIS_URL: redis://redis:6379/0
      AUTO_CREATE_TABLES: "false"
      LOCAL_SYNC_WORKER: "false"
    depends_on:
      backend: { condition: service_healthy }
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    volumes:
      - ./demo_data:/app/demo_data:ro
      - ./sample_outputs:/app/sample_outputs

  frontend:
    build: { context: ./frontend }
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on:
      backend: { condition: service_healthy }

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]

volumes:
  pgdata:
  ollama:
